# 워크플로우의 이름을 지정
name: Spring Boot CI/CD (Build, Push, Update Manifest)

# main 브랜치로 push 이벤트가 발생할 때 이 워크플로우를 실행
on:
  push:
    branches: [ "main" ]
    paths:
      - 'springboot-app/hello/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Maven으로 Spring Boot 앱 빌드
      - name: Build with Maven
        run: mvn clean package
        working-directory: ./springboot-app/hello

      # 4. 고유한 이미지 태그 생성을 위한 Git SHA 가져오기
      - name: Generate short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ARM64 이미지 빌드를 위한 QEMU 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./springboot-app/hello
          file: ./springboot-app/hello/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            huijae67/hello-app:${{ steps.vars.outputs.sha }}
            huijae67/hello-app:latest

      # 7. Kustomize 설치
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # 8. Kustomize를 사용해 Kubernetes 매니페스트 업데이트
      - name: Update K8s manifest with new image tag
        run: kustomize edit set image huijae67/hello-app=huijae67/hello-app:${{ steps.vars.outputs.sha }}
        working-directory: ./springboot-app/hello/k8s

      # 9. 변경된 매니페스트 커밋 및 푸시
      - name: Commit and push manifest changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add ./springboot-app/hello/k8s/kustomization.yaml
          git commit -m "Update image tag for hello-app to ${{ steps.vars.outputs.sha }}"
          git push